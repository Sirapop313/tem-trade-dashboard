<!-- Allocation donut + legend, rendered by dashboard.allocation_panel() through
     components.html. Everything here runs in the browser: selecting a slice or a
     legend row dims the rest without a Streamlit rerun. __DATA__ is replaced with
     JSON from Python; money strings arrive already masked when amounts are hidden. -->
<style>
@font-face{font-family:"IBM Plex Sans Thai";src:url("app/static/fonts/IBMPlexSansThai-Regular.ttf");font-weight:400}
@font-face{font-family:"IBM Plex Sans Thai";src:url("app/static/fonts/IBMPlexSansThai-SemiBold.ttf");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url("app/static/fonts/IBMPlexMono-Regular.ttf");font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url("app/static/fonts/IBMPlexMono-Medium.ttf");font-weight:500}
:root{--bg:#0D1012;--card:#14181B;--raise:#1A1F23;--line:#262C31;--text:#E9E6DF;--muted:#8B9196;--faint:#5B6268;--up:#3DBE7F;--down:#EF5F55}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font-family:"IBM Plex Sans Thai",sans-serif}
.wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:28px;align-items:center;position:relative;padding:4px 0}
.chart{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
.sl{cursor:pointer;transition:opacity .2s,transform .2s;transform-box:fill-box;transform-origin:center}
.lab{font-size:11px;fill:#C9C6BF;pointer-events:none;transition:opacity .2s}
.lead{stroke:#5B6268;stroke-width:1;fill:none;pointer-events:none;transition:opacity .2s}
.c1{font-size:12px;fill:var(--muted)}
.c2{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;fill:var(--text)}
.c3{font-family:"IBM Plex Mono",monospace;font-size:12px}
.list{display:grid;grid-auto-flow:column;column-gap:28px;row-gap:0;max-height:300px;overflow-y:auto;padding-right:4px}
.it{display:grid;grid-template-columns:10px auto auto auto;justify-content:start;column-gap:8px;align-items:center;
    padding:6px 8px;border-radius:5px;cursor:pointer;transition:opacity .2s,background .2s;white-space:nowrap;font-size:14px}
.it:hover{background:var(--raise)}
.it .sw{width:10px;height:10px;border-radius:2px}
.it .tk{font-weight:600;min-width:72px}
.it .w,.it .p{font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.it .w{color:var(--muted);min-width:46px}
.it .p{min-width:58px}
.dim .sl:not(.on),.dim .lab:not(.on),.dim .lead:not(.on){opacity:.18}
.dim .it:not(.on){opacity:.3}
.it.on{background:var(--raise)}
.exp{position:absolute;top:0;left:0;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--card);
     color:var(--muted);cursor:pointer;display:grid;place-items:center;z-index:2}
.exp:hover{color:var(--text)}
.exp svg{width:14px;height:14px}
/* phones: chart above, one-column list (after the base .list rule so it wins) */
@media (max-width:640px){.wrap{grid-template-columns:1fr;gap:12px}.list{grid-auto-flow:row;grid-template-rows:none!important;max-height:260px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<div class="wrap" id="wrap">
  <div class="chart"><button class="exp" id="exp" title="ดูแบบเต็มจอ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <div id="chart"></div></div>
  <div class="list" id="list"></div>
</div>
<script>
const D = __DATA__;
const N = D.items.length;
const TAU = Math.PI * 2;
let sel = null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function arc(cx,cy,r0,r1,a0,a1){
  const L=a1-a0>Math.PI?1:0, p=(r,a)=>[cx+r*Math.sin(a), cy-r*Math.cos(a)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0}A${r1},${r1} 0 ${L} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${L} 0 ${x3},${y3}Z`;
}
function pnlColor(p){return p==null?'var(--muted)':(p>=0?'var(--up)':'var(--down)');}
function fmtPct(p){return p==null?'':(p>0?'+':p<0?'−':'')+Math.abs(p).toFixed(2)+'%';}

/* big=false: compact ring, names outside for slices >=3%.
   big=true: thick ring, names inside every slice wide enough to hold them. */
function donutSVG(big){
  const W=big?640:360, H=big?640:330, cx=W/2, cy=H/2;
  const r1=big?300:118, r0=big?170:76;
  let a=0, paths='', labs='', leftL=[], rightL=[];
  D.items.forEach((it,i)=>{
    const span=it.share/100*TAU, a0=a, a1=a+span, mid=a0+span/2; a=a1;
    const dx=Math.sin(mid), dy=-Math.cos(mid);
    paths+=`<path class="sl" data-i="${i}" data-dx="${dx}" data-dy="${dy}" d="${arc(cx,cy,r0,r1,a0,Math.max(a1-0.004,a0+0.001))}" fill="${it.color}" stroke="#0D1012" stroke-width="1.5"/>`;
    if(big){
      if(it.share>=2.2){
        const rm=(r0+r1)/2, x=cx+rm*dx, y=cy+rm*dy, fs=it.share>=8?16:it.share>=4?13:11;
        labs+=`<text class="lab" data-i="${i}" x="${x}" y="${y-2}" text-anchor="middle" style="font-size:${fs}px;fill:#0D1012;font-weight:600">${esc(it.label)}</text>`+
              `<text class="lab" data-i="${i}" x="${x}" y="${y+fs}" text-anchor="middle" style="font-size:${fs-2}px;fill:#0D1012;font-family:'IBM Plex Mono',monospace">${it.share.toFixed(1)}%</text>`;
      }
    } else if(it.share>=3){
      (dx>=0?rightL:leftL).push({i,dx,dy,y:cy+(r1+16)*dy,x:cx+(r1+16)*dx,ex:cx+(r1+2)*dx,ey:cy+(r1+2)*dy});
    }
  });
  if(!big){
    // keep stacked labels on each side at least 24px apart
    for(const side of [leftL,rightL]){
      side.sort((p,q)=>p.y-q.y);
      for(let k=1;k<side.length;k++) if(side[k].y-side[k-1].y<24) side[k].y=side[k-1].y+24;
      for(const L of side){
        const right=L.dx>=0, tx=right?Math.max(L.x,cx+r1*0.3)+4:Math.min(L.x,cx-r1*0.3)-4, it=D.items[L.i];
        labs+=`<path class="lead" data-i="${L.i}" d="M${L.ex},${L.ey}L${tx+(right?-3:3)},${L.y}"/>`+
              `<text class="lab" data-i="${L.i}" x="${tx}" y="${L.y-1}" text-anchor="${right?'start':'end'}">${esc(it.label)}</text>`+
              `<text class="lab" data-i="${L.i}" x="${tx}" y="${L.y+12}" text-anchor="${right?'start':'end'}" style="font-family:'IBM Plex Mono',monospace">${it.share.toFixed(0)}%</text>`;
      }
    }
  }
  const center=`<g class="ctr"><text class="c1" x="${cx}" y="${cy-10}" text-anchor="middle">รวม</text>`+
               `<text class="c2" x="${cx}" y="${cy+12}" text-anchor="middle">${esc(D.total)}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="สัดส่วนพอร์ต">${paths}${labs}${center}</svg>`;
}
function centerFor(root,cx,cy,big){
  const g=root.querySelector('.ctr'); if(!g) return;
  const s=big?1.5:1;
  if(sel==null){
    g.innerHTML=`<text class="c1" x="${cx}" y="${cy-10*s}" text-anchor="middle" style="font-size:${12*s}px">รวม</text>`+
                `<text class="c2" x="${cx}" y="${cy+12*s}" text-anchor="middle" style="font-size:${15*s}px">${esc(D.total)}</text>`;
  } else {
    const it=D.items[sel];
    g.innerHTML=`<text x="${cx}" y="${cy-22*s}" text-anchor="middle" style="font-size:${15*s}px;font-weight:600;fill:var(--text)">${esc(it.label)}</text>`+
      `<text class="c2" x="${cx}" y="${cy}" text-anchor="middle" style="font-size:${18*s}px">${it.share.toFixed(1)}%</text>`+
      `<text class="c3" x="${cx}" y="${cy+18*s}" text-anchor="middle" style="font-size:${12*s}px;fill:var(--muted)">${esc(it.money)}</text>`+
      (it.pnl==null?'':`<text class="c3" x="${cx}" y="${cy+34*s}" text-anchor="middle" style="font-size:${12*s}px;fill:${pnlColor(it.pnl)}">${fmtPct(it.pnl)}</text>`);
  }
}
function paint(root,big){
  root.classList.toggle('dim', sel!=null);
  root.querySelectorAll('[data-i]').forEach(el=>{
    const on=+el.dataset.i===sel; el.classList.toggle('on',on);
    if(el.classList.contains('sl')){
      const k=on?(big?10:6):0;
      el.style.transform=on?`translate(${el.dataset.dx*k}px,${el.dataset.dy*k}px)`:'';
    }
  });
  const v=root.querySelector('svg[role=img]').viewBox.baseVal; centerFor(root,v.width/2,v.height/2,big);
}

/* ---- inline panel ---- */
const wrap=document.getElementById('wrap'), list=document.getElementById('list');
document.getElementById('chart').innerHTML=donutSVG(false);
list.style.gridTemplateRows=`repeat(${Math.ceil(N/2)},auto)`;
list.innerHTML=D.items.map((it,i)=>`<div class="it" data-i="${i}"><span class="sw" style="background:${it.color}"></span>`+
  `<span class="tk">${esc(it.label)}</span><span class="w">${it.share.toFixed(1)}%</span>`+
  `<span class="p" style="color:${pnlColor(it.pnl)}">${fmtPct(it.pnl)}</span></div>`).join('');
function select(i){
  sel=(i===sel)?null:i; paint(wrap,false);
  if(sel!=null){
    const el=list.querySelector(`.it[data-i="${sel}"]`);
    // scroll the list itself, never the page around the iframe
    if(el){ const top=el.offsetTop-list.offsetTop, bot=top+el.offsetHeight;
      if(top<list.scrollTop||bot>list.scrollTop+list.clientHeight) list.scrollTop=top-list.clientHeight/2+el.offsetHeight/2; }
  }
}
wrap.addEventListener('click',e=>{
  const t=e.target.closest('[data-i]');
  if(t){ e.stopPropagation(); select(+t.dataset.i); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('[data-i]')&&!e.target.closest('#exp')&&sel!=null){ sel=null; paint(wrap,false);} });

/* clicks anywhere else on the dashboard clear the highlight too */
try{
  const pd=window.parent.document, me=window.frameElement;
  const H='_allocClear_'+D.key;
  if(pd[H]) pd.removeEventListener('click',pd[H],true);
  pd[H]=e=>{ if(me && !me.contains(e.target) && e.target!==me && !e.target.closest('#tfin-alloc-big') && sel!=null){ sel=null; paint(wrap,false);} };
  pd.addEventListener('click',pd[H],true);
}catch(e){}

/* fit the iframe to its content (stacks to one column on phones) */
function fit(){
  // measure the panel, not the document: before layout settles the document can
  // report 0. Streamlit also redraws the iframe and its wrapper with the height it
  // was created with, so set both and re-apply whenever either is touched.
  try{
    const h=Math.ceil(wrap.getBoundingClientRect().height)+8; if(h<=60) return;
    const fe=window.frameElement; if(!fe) return;
    const pc=fe.closest('[data-testid="stElementContainer"]');
    for(const el of [fe,pc]) if(el && el.style.height!==h+'px'){ el.style.height=h+'px'; el.style.minHeight=h+'px'; }
  }catch(e){}
}
fit(); window.addEventListener('resize',fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
try{
  const fe=window.frameElement, pc=fe&&fe.closest('[data-testid="stElementContainer"]');
  const mo=new MutationObserver(fit);
  if(fe) mo.observe(fe,{attributes:true,attributeFilter:['style','height']});
  if(pc) mo.observe(pc,{attributes:true,attributeFilter:['style','height']});
}catch(e){}
[100,600,1500].forEach(t=>setTimeout(fit,t));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

/* ---- full-screen view, drawn into the dashboard page itself ---- */
document.getElementById('exp').addEventListener('click',e=>{
  e.stopPropagation();
  let pd; try{ pd=window.parent.document; }catch(err){ return; }
  const old=pd.getElementById('tfin-alloc-big'); if(old) old.remove();
  const ov=pd.createElement('div'); ov.id='tfin-alloc-big';
  ov.innerHTML=`<style>
    #tfin-alloc-big{position:fixed;inset:0;z-index:2147483647;background:rgba(5,6,7,.82);display:flex;align-items:center;justify-content:center;
      font-family:"IBM Plex Sans Thai",sans-serif;color:#E9E6DF;--text:#E9E6DF;--muted:#8B9196;--up:#3DBE7F;--down:#EF5F55}
    #tfin-alloc-big .pnl{background:#14181B;border:1px solid #262C31;border-radius:10px;padding:20px 20px 16px;width:min(1100px,94vw);max-height:94vh;
      display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr);gap:20px;position:relative;overflow:auto}
    @media (max-width:760px){#tfin-alloc-big .pnl{grid-template-columns:1fr}}
    #tfin-alloc-big .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border:1px solid #262C31;border-radius:6px;background:transparent;color:#8B9196;cursor:pointer;font-size:18px;line-height:1}
    #tfin-alloc-big .x:hover{color:#E9E6DF}
    #tfin-alloc-big svg{display:block;width:100%;height:auto;max-height:82vh}
    #tfin-alloc-big .sl{cursor:pointer;transition:opacity .2s,transform .2s;transform-box:fill-box;transform-origin:center}
    #tfin-alloc-big .lab{pointer-events:none;transition:opacity .2s}
    #tfin-alloc-big .c1{fill:#8B9196}#tfin-alloc-big .c2{font-family:"IBM Plex Mono",monospace;font-weight:500;fill:#E9E6DF}
    #tfin-alloc-big .c3{font-family:"IBM Plex Mono",monospace}
    #tfin-alloc-big.dim .sl:not(.on),#tfin-alloc-big.dim .lab:not(.on){opacity:.18}
    #tfin-alloc-big.dim .it:not(.on){opacity:.3}
    #tfin-alloc-big .lst{align-self:center;max-height:80vh;overflow-y:auto;padding-right:6px}
    #tfin-alloc-big .it{display:grid;grid-template-columns:12px 1fr auto auto;column-gap:10px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:15px;transition:opacity .2s,background .2s}
    #tfin-alloc-big .it:hover,#tfin-alloc-big .it.on{background:#1A1F23}
    #tfin-alloc-big .sw{width:12px;height:12px;border-radius:3px}
    #tfin-alloc-big .tk{font-weight:600}
    #tfin-alloc-big .w,#tfin-alloc-big .p{font-family:"IBM Plex Mono",monospace;font-size:14px;text-align:right}
    #tfin-alloc-big .w{color:#8B9196}
  </style>
  <div class="pnl"><button class="x" title="ปิด">✕</button><div class="ch">${donutSVG(true)}</div>
  <div class="lst">${D.items.map((it,i)=>`<div class="it" data-i="${i}"><span class="sw" style="background:${it.color}"></span><span class="tk">${esc(it.label)}</span><span class="w">${it.share.toFixed(1)}%</span><span class="p" style="color:${pnlColor(it.pnl)}">${fmtPct(it.pnl)}</span></div>`).join('')}</div></div>`;
  pd.body.appendChild(ov);
  const pnl=ov.querySelector('.pnl');
  const close=()=>{ ov.remove(); pd.removeEventListener('keydown',onKey,true); };
  const onKey=ev=>{ if(ev.key==='Escape') close(); };
  pd.addEventListener('keydown',onKey,true);
  ov.querySelector('.x').addEventListener('click',close);
  ov.addEventListener('click',ev=>{
    if(!pnl.contains(ev.target)){ close(); return; }
    const t=ev.target.closest('[data-i]');
    sel = t ? ((+t.dataset.i===sel)?null:+t.dataset.i) : null;
    paint(ov,true); paint(wrap,false);
    if(sel!=null){ const el=ov.querySelector(`.it[data-i="${sel}"]`); if(el) el.scrollIntoView({block:'nearest'}); }
  });
  paint(ov,true);
});
</script>
