<!-- Per-table actions (expand / save image / CSV), rendered by dashboard.table_tools()
     through components.html. Runs entirely in the browser: no Streamlit rerun.
     The expanded view and the image are built in the dashboard page itself (same
     origin), where the app fonts are loaded, so Thai text shapes correctly.
     __DATA__ = {"title", "file", "cols": [...], "rows": [[...], ...]} — cells are
     already-formatted strings (masked when amounts are hidden). -->
<style>
@font-face{font-family:"IBM Plex Sans Thai";src:url("app/static/fonts/IBMPlexSansThai-Medium.ttf");font-weight:500}
html,body{margin:0;background:transparent;font-family:"IBM Plex Sans Thai",sans-serif}
.bar{display:flex;justify-content:flex-end;gap:6px;padding:2px 0}
button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #262C31;border-radius:6px;
       background:#14181B;color:#8B9196;font:500 12.5px "IBM Plex Sans Thai",sans-serif;cursor:pointer}
button:hover{color:#E9E6DF;border-color:#5B6268}
button svg{width:13px;height:13px}
button[disabled]{opacity:.5;cursor:default}
</style>
<div class="bar">
  <button id="b-exp" title="ดูตารางทั้งหมดแบบเต็มจอ"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>ขยาย</button>
  <button id="b-img" title="บันทึกทั้งตารางเป็นรูป PNG"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="6" cy="7" r="1.3"/><path d="M14 11l-4-3-6 5"/></svg>บันทึกรูป</button>
  <button id="b-csv" title="ดาวน์โหลด CSV"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 13h10"/></svg>CSV</button>
</div>
<script>
const D = __DATA__;
const pd = window.parent.document;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// same colouring rule the app uses for P&L text: leading + green, leading − / - red
function tone(v){const s=String(v==null?'':v).trim(); return /^\+/.test(s)?'#3DBE7F':(/^[−-]\D?\d/.test(s)?'#EF5F55':null);}
const RIGHT = new Set(D.cols.map((c,i)=>i).filter(i=>D.rows.every(r=>{const s=String(r[i]==null?'':r[i]).trim(); return s==='' || s==='—' || /^[+−-]?[฿$]?[\d,.]+%?$/.test(s.replace(/\s/g,''));})));

function tableHTML(){
  const th=D.cols.map((c,i)=>`<th style="text-align:${RIGHT.has(i)?'right':'left'}">${esc(c)}</th>`).join('');
  const tr=D.rows.map(r=>'<tr>'+r.map((v,i)=>{const t=tone(v);
    return `<td style="text-align:${RIGHT.has(i)?'right':'left'}${t?';color:'+t+';font-weight:600':''}">${esc(v)}</td>`;}).join('')+'</tr>').join('');
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}
const CSS = `
  .ttx{font-family:"IBM Plex Sans Thai",sans-serif;color:#E9E6DF;background:#14181B}
  .ttx h3{margin:0 0 12px;font-size:15px;font-weight:600;color:#E9E6DF}
  .ttx .meta{font-size:12px;color:#8B9196;margin:-8px 0 12px}
  .ttx table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  .ttx th{font-weight:500;color:#8B9196;padding:8px 12px;border-bottom:1px solid #262C31;white-space:nowrap;background:#1A1F23}
  .ttx td{padding:7px 12px;border-bottom:1px solid #262C31;white-space:nowrap}
  .ttx tr:last-child td{border-bottom:0}`;

function download(name, blob){
  const url=URL.createObjectURL(blob), a=pd.createElement('a');
  a.href=url; a.download=name; pd.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function csv(){
  const q=v=>{const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const text='﻿'+[D.cols,...D.rows].map(r=>r.map(q).join(',')).join('\r\n');   // BOM: Excel reads Thai
  download(D.file+'.csv', new Blob([text],{type:'text/csv;charset=utf-8'}));
}
function loadH2C(){
  return new Promise((ok,bad)=>{
    const w=window.parent; if(w.html2canvas) return ok(w.html2canvas);
    const s=pd.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>ok(w.html2canvas); s.onerror=()=>bad(new Error('load')); pd.head.appendChild(s);
  });
}
async function image(btn){
  if(btn){btn.disabled=true;}
  // render the whole table off-screen in the dashboard page, at its natural width
  const host=pd.createElement('div');
  host.className='ttx';
  host.style.cssText='position:fixed;left:-100000px;top:0;padding:20px 22px;display:inline-block;';
  host.innerHTML=`<style>${CSS}</style><h3>${esc(D.title)}</h3><div class="meta">Tim.fin OS · ${new Date().toLocaleDateString('th-TH')}</div>${tableHTML()}`;
  pd.body.appendChild(host);
  try{
    if(pd.fonts && pd.fonts.ready) await pd.fonts.ready;
    const h2c=await loadH2C();
    const canvas=await h2c(host,{backgroundColor:'#14181B',scale:2,logging:false,
                                width:host.scrollWidth,height:host.scrollHeight,windowWidth:host.scrollWidth+200});
    canvas.toBlob(b=>download(D.file+'.png', b),'image/png');
  }catch(e){ alert('บันทึกรูปไม่สำเร็จ — ลองใหม่อีกครั้ง'); }
  finally{ host.remove(); if(btn){btn.disabled=false;} }
}
function expand(){
  const old=pd.getElementById('tfin-table-big'); if(old) old.remove();
  const ov=pd.createElement('div'); ov.id='tfin-table-big';
  ov.innerHTML=`<style>${CSS}
    #tfin-table-big{position:fixed;inset:0;z-index:2147483647;background:rgba(5,6,7,.82);display:flex;align-items:center;justify-content:center}
    #tfin-table-big .pnl{width:min(1400px,96vw);max-height:92vh;border:1px solid #262C31;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
    #tfin-table-big .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #262C31}
    #tfin-table-big .hd h3{margin:0;flex:1}
    #tfin-table-big .bd{overflow:auto;padding:0 4px 8px}
    #tfin-table-big .bd th{position:sticky;top:0}
    #tfin-table-big .bd table{width:100%}
    #tfin-table-big button{height:30px;padding:0 12px;border:1px solid #262C31;border-radius:6px;background:#14181B;color:#8B9196;font:500 13px "IBM Plex Sans Thai",sans-serif;cursor:pointer}
    #tfin-table-big button:hover{color:#E9E6DF;border-color:#5B6268}</style>
    <div class="pnl ttx"><div class="hd"><h3>${esc(D.title)} <span style="color:#8B9196;font-weight:400;font-size:13px">· ${D.rows.length} แถว</span></h3>
      <button data-a="img">บันทึกรูป</button><button data-a="csv">CSV</button><button data-a="x" title="ปิด">✕</button></div>
      <div class="bd">${tableHTML()}</div></div>`;
  pd.body.appendChild(ov);
  const close=()=>{ov.remove(); pd.removeEventListener('keydown',onKey,true);};
  const onKey=e=>{if(e.key==='Escape') close();};
  pd.addEventListener('keydown',onKey,true);
  ov.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]');
    if(a){ if(a.dataset.a==='x') close(); else if(a.dataset.a==='csv') csv(); else image(a); return; }
    if(!e.target.closest('.pnl')) close();
  });
}
document.getElementById('b-exp').onclick=expand;
document.getElementById('b-img').onclick=e=>image(e.currentTarget);
document.getElementById('b-csv').onclick=csv;
</script>
